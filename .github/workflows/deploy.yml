# Builds the site and uploads it to the cPanel hosting on every push to main —
# including every publish from the content editor at /builder.
#
# The build runs here, not on the hosting: the hosting caps memory at 2 GB,
# which a Next.js build can exceed. The hosting only runs the finished server
# (cPanel → Setup Node.js App, startup file app.js).
#
# Secrets (GitHub → Settings → Secrets and variables → Actions):
#   FTP_SERVER     cpp75.webserver.pt (the host its TLS certificate names)
#   FTP_USERNAME   the FTP account whose home is the Node app's folder
#   FTP_PASSWORD   its password
#   ENV_FILE       the server-only settings, as the lines of a .env file
name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

permissions:
  # contents: write publishes the static assets to the gh-pages branch.
  contents: write
  statuses: write

env:
  NEXT_PUBLIC_SITE_URL: https://callmeophelia.com
  # Images, scripts, styles and fonts are served from GitHub Pages' CDN: the
  # hosting refuses bursts of more than ~20 requests per visitor.
  NEXT_PUBLIC_ASSET_URL: https://joaodorey123.github.io/ophelia
  # Read by the content editor to follow a publish until it is live.
  STATUS_CONTEXT: deploy/cpanel

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Report pending
        run: |
          curl -fsS -X POST -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{"state":"pending","context":"${{ env.STATUS_CONTEXT }}","description":"A publicar no site…","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Settings for the build
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s\n' "$ENV_FILE" > .env.production
          # The deployed site is never the development fixture.
          echo 'OPHELIA_FORCE_LOCAL_CATALOGUE="false"' >> .env.production

      - name: Cache the Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-

      - name: Reuse pre-built image sizes
        uses: actions/cache@v4
        with:
          path: public/_img
          key: img-${{ hashFiles('public/photos/**', 'public/photography/**', 'public/decor/**', 'public/brand/**', 'public/uploads/**', 'scripts/build-images.mjs') }}
          restore-keys: img-

      - name: Build
        run: npm run build

      - name: Assemble the static assets
        run: |
          mkdir -p cdn/_next
          cp -R .next/static cdn/_next/static
          cp -R public/_img cdn/_img
          # Background images the stylesheets point at (resolved to the CDN too).
          cp -R public/decor cdn/decor
          cp -R public/textures cdn/textures
          touch cdn/.nojekyll

      - name: Publish the static assets to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: ./cdn
          # Keep earlier builds' files, so a page rendered just before this
          # deploy can still load its scripts and images.
          keep_files: true
          commit_message: 'Assets for ${{ github.sha }}'

      - name: Wait until the assets are live
        run: |
          file=$(cd .next/static && find chunks -name '*.js' | head -1)
          url="$NEXT_PUBLIC_ASSET_URL/_next/static/$file"
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$url")" = "200" ] && echo "live: $url" && exit 0
            sleep 10
          done
          echo "The assets did not appear on GitHub Pages; leaving the live site as it is."
          exit 1

      - name: Assemble the app folder
        run: |
          mkdir -p out/server out/tmp
          cp -R .next/standalone/. out/server/
          mkdir -p out/server/.next/static
          cp -R .next/static/. out/server/.next/static/
          mkdir -p out/server/public
          # Pre-built images are served by the CDN, not the hosting.
          rsync -a --exclude '_img' public/ out/server/public/
          cp deploy/cpanel/app.js out/app.js
          cp .env.production out/.env.production
          date -u +%FT%TZ > restart.txt

      - name: Upload
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ./
          exclude: |
            tmp/**
            **/.git*
            **/.git*/**

      - name: Restart the app
        run: |
          curl -fsS --ssl-reqd --ftp-create-dirs -T restart.txt \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            "ftp://${{ secrets.FTP_SERVER }}/tmp/restart.txt"

      - name: Check the site answers
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$NEXT_PUBLIC_SITE_URL/robots.txt" || true)
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "The site did not answer after the upload (last status: $code)."
          exit 1

      - name: Warm up the main pages
        # The first request after a restart starts the app and renders the
        # page; do that here rather than for the first visitor.
        run: |
          for path in / /em-breve /comprar /menu /quem-somos /bolos /eventos /diario /contacto; do
            curl -s -o /dev/null -w "$path %{http_code} %{time_total}s\n" "$NEXT_PUBLIC_SITE_URL$path" || true
          done

      - name: Report result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then state=success; text="No ar"; else state=failure; text="A publicação falhou"; fi
          curl -fsS -X POST -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$state\",\"context\":\"${{ env.STATUS_CONTEXT }}\",\"description\":\"$text\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
