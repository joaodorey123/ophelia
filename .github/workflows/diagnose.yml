# Manual check of how the hosting answers a burst of requests, like one page
# load, from an address that has never visited the site.
name: Diagnose request limits

on:
  workflow_dispatch:

permissions: {}

jobs:
  burst:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: One page load, in parallel (HTTP/2, like a browser)
        run: |
          urls=$(for i in $(seq 1 30); do printf 'https://callmeophelia.com/robots.txt?i=%s ' "$i"; done)
          curl -s --http2 --parallel --parallel-max 30 -o /dev/null -w '%{http_code}\n' $urls | sort | uniq -c
      - name: Sequential, one after another
        run: |
          sleep 30
          for i in $(seq 1 20); do curl -s -o /dev/null -w '%{http_code} ' "https://callmeophelia.com/robots.txt?s=$i"; done; echo
